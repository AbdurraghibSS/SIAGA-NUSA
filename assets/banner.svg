<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="SIAGA NUSA — Sistem Intelijen Agen Generatif untuk Analisis Bencana Nusantara">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1230"/>
      <stop offset="0.6" stop-color="#132457"/>
      <stop offset="1" stop-color="#3A1C3F"/>
    </linearGradient>
    <linearGradient id="alert" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#FF3D3D"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#dots)"/>

  <!-- seismogram -->
  <polyline fill="none" stroke="url(#alert)" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"
    points="760,250 800,250 815,246 828,254 840,250 860,250 870,236 880,268 890,212 902,292 914,176 926,320 938,196 950,280 962,226 974,262 986,240 998,256 1010,246 1024,252 1040,249 1060,250 1150,250"/>

  <!-- radar rings from an epicentre -->
  <g fill="none" stroke="#FF7A1A">
    <circle cx="1010" cy="110" r="18" stroke-width="2" opacity="0.9"/>
    <circle cx="1010" cy="110" r="38" stroke-width="1.6" opacity="0.55"/>
    <circle cx="1010" cy="110" r="60" stroke-width="1.2" opacity="0.3"/>
    <circle cx="1010" cy="110" r="84" stroke-width="1" opacity="0.15"/>
  </g>
  <circle cx="1010" cy="110" r="7" fill="#FF3D3D"/>

  <!-- archipelago dots -->
  <g fill="#7FB2FF" opacity="0.5">
    <ellipse cx="820" cy="120" rx="34" ry="9" transform="rotate(-35 820 120)"/>
    <ellipse cx="880" cy="160" rx="36" ry="7"/>
    <ellipse cx="925" cy="105" rx="26" ry="20"/>
    <ellipse cx="960" cy="150" rx="10" ry="16"/>
    <ellipse cx="1090" cy="150" rx="40" ry="14"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="64" y="52" width="250" height="32" rx="16" fill="#FF7A1A" fill-opacity="0.16" stroke="#FF7A1A" stroke-opacity="0.6"/>
    <text x="189" y="74" text-anchor="middle" fill="#FFC9A3" font-size="15" font-weight="700" letter-spacing="1.5">AGENTIC AI · BENCANA</text>

    <text x="64" y="156" fill="#FFFFFF" font-size="74" font-weight="800" letter-spacing="2">SIAGA NUSA</text>
    <rect x="66" y="174" width="170" height="5" rx="2.5" fill="url(#alert)"/>
    <text x="64" y="216" fill="#CFE0FF" font-size="21" font-weight="600">Sistem Intelijen Agen Generatif untuk Analisis Bencana Nusantara</text>
    <text x="64" y="268" fill="#FFFFFF" fill-opacity="0.85" font-size="22" font-style="italic">"Lebih Cepat Memahami. Lebih Siap Menghadapi."</text>
  </g>
</svg>
