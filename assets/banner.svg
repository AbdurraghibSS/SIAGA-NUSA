<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="SIAGA NUSA — Sistem Intelijen Agen Generatif untuk Analisis Cuaca dan Banjir Nusantara">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1230"/>
      <stop offset="0.6" stop-color="#132457"/>
      <stop offset="1" stop-color="#3A1C3F"/>
    </linearGradient>
    <linearGradient id="alert" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#FF3D3D"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#dots)"/>

  <!-- rain -->
  <g stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <line x1="884" y1="194" x2="876" y2="214"/>
    <line x1="928" y1="182" x2="920" y2="202"/>
    <line x1="972" y1="196" x2="964" y2="216"/>
    <line x1="1016" y1="184" x2="1008" y2="204"/>
    <line x1="1060" y1="194" x2="1052" y2="214"/>
    <line x1="1104" y1="182" x2="1096" y2="202"/>
    <line x1="1148" y1="192" x2="1140" y2="212"/>
  </g>

  <!-- rising water -->
  <path fill="none" stroke="url(#alert)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"
    d="M760,250 Q785,236 810,250 T860,250 T910,250 T960,250 T1010,250 T1060,250 T1110,250 T1150,250"/>
  <path fill="none" stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" opacity="0.4"
    d="M780,276 Q805,264 830,276 T880,276 T930,276 T980,276 T1030,276 T1080,276 T1130,276"/>

  <!-- weather radar -->
  <g fill="none" stroke="#FF7A1A">
    <circle cx="1010" cy="110" r="18" stroke-width="2" opacity="0.9"/>
    <circle cx="1010" cy="110" r="38" stroke-width="1.6" opacity="0.55"/>
    <circle cx="1010" cy="110" r="60" stroke-width="1.2" opacity="0.3"/>
    <circle cx="1010" cy="110" r="84" stroke-width="1" opacity="0.15"/>
  </g>
  <circle cx="1010" cy="110" r="7" fill="#FF3D3D"/>

  <!-- archipelago dots -->
  <g fill="#7FB2FF" opacity="0.5">
    <ellipse cx="820" cy="120" rx="34" ry="9" transform="rotate(-35 820 120)"/>
    <ellipse cx="880" cy="160" rx="36" ry="7"/>
    <ellipse cx="925" cy="105" rx="26" ry="20"/>
    <ellipse cx="960" cy="150" rx="10" ry="16"/>
    <ellipse cx="1090" cy="150" rx="40" ry="14"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="64" y="52" width="300" height="32" rx="16" fill="#FF7A1A" fill-opacity="0.16" stroke="#FF7A1A" stroke-opacity="0.6"/>
    <text x="214" y="74" text-anchor="middle" fill="#FFC9A3" font-size="15" font-weight="700" letter-spacing="1.5">AGENTIC AI · CUACA &amp; BANJIR</text>

    <text x="64" y="156" fill="#FFFFFF" font-size="74" font-weight="800" letter-spacing="2">SIAGA NUSA</text>
    <rect x="66" y="174" width="170" height="5" rx="2.5" fill="url(#alert)"/>
    <text x="64" y="216" fill="#CFE0FF" font-size="21" font-weight="600">Sistem Intelijen Agen Generatif untuk Analisis Cuaca dan Banjir Nusantara</text>
    <text x="64" y="268" fill="#FFFFFF" fill-opacity="0.85" font-size="22" font-style="italic">"Lebih Cepat Memahami. Lebih Siap Menghadapi."</text>
  </g>
</svg>
