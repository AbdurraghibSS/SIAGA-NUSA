[project]
name = "siaga-nusa"
version = "0.1.0"
description = "SIAGA NUSA · Weather & Flood Intelligence"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
notebook = [
    "ipykernel>=6",
    "matplotlib>=3.8",
    "nbconvert>=7",
]
ml = [
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "mlflow>=2.16",
    "xgboost>=2.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
