[project]
name = "siaga-nusa"
version = "0.1.0"
description = "SIAGA NUSA · Weather & Flood Intelligence"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
notebook = [
    "ipykernel>=6",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
