[project]
name = "siaga-nusa"
version = "0.1.0"
description = "SIAGA NUSA · Weather & Flood Intelligence"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-genai>=1.50",     # agen Tanya: Gemini function calling
    "qdrant-client>=1.20",    # vector DB untuk RAG panduan (lokal atau Qdrant Cloud Inference)
]
# Dependensi inti di atas = yang dipasang Vercel (API + agen). Embedding lokal, PDF, dan
# penjadwal hanya untuk Docker/laptop, jadi dipisah supaya paket fungsi Vercel tetap ramping.

[project.optional-dependencies]
local = [
    "fastembed>=0.6",         # embedding lokal (ONNX) untuk RAG, tanpa kuota API
    "pypdf>=5",               # ekstraksi teks PDF panduan (job knowledge)
    "apscheduler>=3.10,<4",   # penjadwal pipeline (service scheduler)
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
notebook = [
    "ipykernel>=6",
    "matplotlib>=3.8",
    "nbconvert>=7",
]
ml = [
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "mlflow==3.18.0",          # dikunci: skema data/mlflow/mlflow.db dibuat versi ini
    "xgboost>=2.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "api*"]

# Vercel: FastAPI di api/main.py menjadi satu Vercel Function; web/ (StaticFiles) dipromosikan ke CDN.
[tool.vercel]
entrypoint = "api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
