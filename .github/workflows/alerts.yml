# Peringatan dini cuaca BMKG (nowcast CAP) → Postgres produksi, tiap 15 menit.
# Nowcast berlaku 1–3 jam; GitHub bisa menunda cron beberapa menit, jadi dasbor menandai data basi > 45 menit.
name: Peringatan dini BMKG

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install .
      - name: Tarik peringatan dini BMKG
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.run alerts
