# Arsip snapshot prakiraan BMKG + Open-Meteo ke branch `data-snapshots`.
# Sementara sampai pipeline berjalan di Azure VM; arsip ini nanti di-backfill ke Postgres.
name: Snapshot prakiraan

on:
  schedule:
    # Dijadwalkan tiap jam (UTC). GitHub sering menunda/melewati cron: dengan */3 yang benar-benar
    # jalan cuma ±3 run/hari (6–19 Nov 2026), jadi jadwal dirapatkan supaya cakupan harian cukup.
    # Respons BMKG di-cache CDN 1 jam, BMKG terbit ±2× sehari; Open-Meteo 1 panggilan per run.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install .

      - name: Siapkan worktree data-snapshots
        run: |
          if git ls-remote --exit-code --heads origin data-snapshots >/dev/null; then
            git fetch --depth=1 origin data-snapshots
            git worktree add -B data-snapshots data FETCH_HEAD
          else
            git worktree add --orphan -b data-snapshots data
          fi

      - name: Ambil snapshot dan commit
        run: |
          set +e
          python -m pipeline.ingest.snapshot --out data/snapshots
          status=$?
          set -e

          cd data
          git add snapshots
          if git diff --cached --quiet; then
            echo "Tidak ada snapshot baru"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin data-snapshots
          fi
          # Merah hanya kalau semua panggilan gagal; kegagalan sebagian muncul sebagai warning.
          # Snapshot yang berhasil (dan envelope error-nya) tetap tersimpan.
          exit $status
