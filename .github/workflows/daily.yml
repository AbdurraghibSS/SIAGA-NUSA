# Data harian + prediksi Model A, pukul 05.30 WIB (22.30 UTC).
#   history  ERA5 (susulan lewat API dari tanggal terakhir di DB)
#   floods   PetaBencana bulan lalu + bulan ini
#   rivers   GloFAS (arsip tahunan di-cache antar-run supaya tidak diunduh ulang)
#   archive  Previous Runs Open-Meteo (fitur Model A, juga di-cache)
#   predict  Model A dari salinan di repo (models/), karena MLflow hanya ada di laptop
# Lalu satu pencarian ke Qdrant Cloud supaya cluster free tidak disuspend karena tidak dipakai.
name: Data harian dan Model A

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[ml]"

      - name: Pulihkan arsip mentah (GloFAS, Previous Runs, PetaBencana)
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Jalankan job harian
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MLFLOW_TRACKING_URI: http://127.0.0.1:9   # sengaja tak terjangkau → pakai salinan models/
        run: python -m pipeline.run history floods rivers archive views predict

      - name: Simpan arsip mentah
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}

      - name: Jaga Qdrant Cloud tetap aktif
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_CLOUD_INFERENCE: "true"
        run: python -c "from pipeline.knowledge import search; print(len(search('banjir', k=1)), 'hasil')"
