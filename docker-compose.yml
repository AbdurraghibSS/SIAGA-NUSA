# SIAGA NUSA lokal · db (PostGIS) + backend (FastAPI) + frontend (nginx).
#   docker compose up -d --build     → dasbor http://localhost:8010 · API docs http://localhost:8010/docs
#
# network_mode: host karena firewall laptop (ufw + VPN kantor) memblokir
# port forwarding host → container. Postgres langsung mendengarkan di port
# host 5434 supaya tidak bentrok dengan Postgres lain. Backend di 127.0.0.1:8011, frontend
# di 127.0.0.1:8010 (meneruskan /api ke backend). restart: unless-stopped → semuanya ikut
# naik setiap kali Docker hidup.
services:
  db:
    image: postgis/postgis:16-3.4
    network_mode: host
    command: ["postgres", "-p", "${DB_PORT:-5434}", "-c", "listen_addresses=localhost"]
    environment:
      POSTGRES_DB: siaga_nusa
      POSTGRES_USER: siaga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siaga_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p ${DB_PORT:-5434} -U siaga -d siaga_nusa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host            # pip install saat build lewat jaringan host
    image: siaga-nusa-backend
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://siaga:${POSTGRES_PASSWORD:-siaga_dev}@localhost:${DB_PORT:-5434}/siaga_nusa
      SERVE_WEB: "false"
      API_KEY: ${API_KEY:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://127.0.0.1:5000}
    command: ["uvicorn", "api.main:app", "--host", "127.0.0.1", "--port", "${API_PORT:-8011}"]
    volumes:
      - ./data:/app/data       # data pipeline (snapshot, arsip) dipakai bersama dengan host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:${API_PORT:-8011}/health', timeout=3).status != 200)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      network: host
    image: siaga-nusa-frontend
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    environment:
      WEB_PORT: ${WEB_PORT:-8010}
      API_UPSTREAM: 127.0.0.1:${API_PORT:-8011}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:${WEB_PORT:-8010}/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
