# SIAGA NUSA lokal · db (PostGIS) + qdrant (vector DB untuk RAG) + mlflow (registry Model A)
#                    + scheduler (pipeline terjadwal) + backend (FastAPI) + frontend (nginx).
#   docker compose up -d --build     → dasbor http://localhost:8010 · API docs http://localhost:8010/docs
#
# network_mode: host karena firewall laptop (ufw + VPN kantor) memblokir
# port forwarding host → container. Postgres langsung mendengarkan di port
# host 5434 supaya tidak bentrok dengan Postgres lain. Backend di 127.0.0.1:8011, frontend
# di 127.0.0.1:8010 (meneruskan /api ke backend). restart: unless-stopped → semuanya ikut
# naik setiap kali Docker hidup.
services:
  db:
    image: postgis/postgis:16-3.4
    network_mode: host
    command: ["postgres", "-p", "${DB_PORT:-5434}", "-c", "listen_addresses=localhost"]
    environment:
      POSTGRES_DB: siaga_nusa
      POSTGRES_USER: siaga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siaga_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p ${DB_PORT:-5434} -U siaga -d siaga_nusa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Vector DB untuk RAG agen Tanya: potongan panduan BNPB/BMKG/BPBD + embedding Gemini.
  # Diisi job `python -m pipeline.run knowledge` dari host. HTTP 6333, gRPC 6334, hanya localhost.
  qdrant:
    image: qdrant/qdrant:v1.20.0
    network_mode: host
    environment:
      QDRANT__SERVICE__HOST: 127.0.0.1
      QDRANT__SERVICE__HTTP_PORT: ${QDRANT_PORT:-6333}
      QDRANT__SERVICE__GRPC_PORT: ${QDRANT_GRPC_PORT:-6334}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host            # pip install saat build lewat jaringan host
      args:
        EXTRAS: "[local]"      # embedding lokal (FastEmbed) untuk RAG di Qdrant lokal
    image: siaga-nusa-backend
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://siaga:${POSTGRES_PASSWORD:-siaga_dev}@localhost:${DB_PORT:-5434}/siaga_nusa
      SERVE_WEB: "false"
      API_KEY: ${API_KEY:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://127.0.0.1:5000}
      QDRANT_URL: http://127.0.0.1:${QDRANT_PORT:-6333}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.6-flash,gemini-3.5-flash-lite}
    command: ["uvicorn", "api.main:app", "--host", "127.0.0.1", "--port", "${API_PORT:-8011}"]
    volumes:
      - ./data:/app/data       # data pipeline (snapshot, arsip) + model embedding data/models, dipakai bersama host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:${API_PORT:-8011}/health', timeout=3).status != 200)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # MLflow (tracking + model registry, Model A siaganusa-hujan@champion). Data di data/mlflow
  # (disalin dari stack PanganAI 26 Nov 2026). Image sama dengan scheduler (grup [ml], mlflow 3.18.0).
  mlflow:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
      args:
        EXTRAS: "[local,ml]"
    image: siaga-nusa-scheduler
    network_mode: host
    command: ["mlflow", "server", "--host", "127.0.0.1", "--port", "${MLFLOW_PORT:-5000}",
              "--backend-store-uri", "sqlite:////app/data/mlflow/mlflow.db",
              "--serve-artifacts", "--artifacts-destination", "/app/data/mlflow/mlartifacts",
              "--allowed-hosts", "localhost:${MLFLOW_PORT:-5000},127.0.0.1:${MLFLOW_PORT:-5000}"]
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:${MLFLOW_PORT:-5000}/health', timeout=3).status != 200)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Pipeline terjadwal (pipeline/scheduler.py): snapshot BMKG + Open-Meteo tiap jam, data harian +
  # prediksi Model A pukul 05.30 WIB. Model A dimuat dari server MLflow (MLFLOW_TRACKING_URI).
  scheduler:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
      args:
        EXTRAS: "[local,ml]"
    image: siaga-nusa-scheduler
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started   # predict punya salinan lokal kalau MLflow belum siap
    environment:
      DATABASE_URL: postgresql+psycopg://siaga:${POSTGRES_PASSWORD:-siaga_dev}@localhost:${DB_PORT:-5434}/siaga_nusa
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://127.0.0.1:5000}
      TZ: Asia/Jakarta
    command: ["python", "-m", "pipeline.scheduler"]
    volumes:
      - ./data:/app/data       # snapshot, arsip ERA5/GloFAS/Previous Runs dipakai bersama host
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      network: host
    image: siaga-nusa-frontend
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    environment:
      WEB_PORT: ${WEB_PORT:-8010}
      API_UPSTREAM: 127.0.0.1:${API_PORT:-8011}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-tim}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}   # kosong = tanpa login (lokal); WAJIB diisi sebelum tunnel
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:${WEB_PORT:-8010}/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Akses tim dari luar lewat Cloudflare quick tunnel (gratis, tanpa akun). TIDAK ikut `up` biasa:
  #   docker compose --profile public up -d tunnel
  #   docker compose logs tunnel | grep trycloudflare.com      → URL publik (berganti tiap nyala ulang)
  #   docker compose stop tunnel                                → tutup akses
  # Hanya nginx (dasbor + /api) yang terbuka; isi BASIC_AUTH_PASSWORD dulu di .env.
  tunnel:
    image: cloudflare/cloudflared:2026.11.0
    profiles: ["public"]
    network_mode: host
    command: ["tunnel", "--no-autoupdate", "--url", "http://127.0.0.1:${WEB_PORT:-8010}"]
    depends_on:
      frontend:
        condition: service_healthy
    restart: "no"              # membuka akses publik harus disengaja, tidak menyala sendiri

volumes:
  pgdata:
  qdrant_data:
